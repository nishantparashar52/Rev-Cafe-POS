<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REV CAFE POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REV CAFE">
<meta name="theme-color" content="#3b2417">
<link rel="stylesheet" href="styles.css">
</head><body>
<header><b>REV CAFE</b><nav>
<button data-tab="bill">Bill</button><button data-tab="dash">Dashboard</button><button data-tab="inventory">Inventory</button><button data-tab="manage">Manage</button><button data-tab="settings">Settings</button></nav></header>
<main id="view"></main>
<footer class="bar" id="bar"><div>Total <b id="gt">₹0</b></div><button id="order" class="primary">Place Order</button></footer>
<dialog id="dlg"><form id="pf" method="dialog">
<h3 id="dt">Product</h3>
<label>Name *<input name="name" required maxlength="80"></label>
<label>Selling price (₹, leave empty if not set)<input name="price" inputmode="decimal"></label>
<label>Product code (optional)<input name="code" maxlength="30"></label>
<label>Category (optional)<input name="category" list="cl" maxlength="40"><datalist id="cl"></datalist></label>
<label class="chk"><input type="checkbox" name="active"> Active</label>
<p id="err" class="np"></p>
<div class="acts"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div>
</form></dialog>
<dialog id="od"><h3>Payment received by</h3><p id="odt"></p><div class="od-grid"><button class="primary" data-act="pay" data-m="cash" data-print="1">🖨 Cash + Print</button><button class="primary" data-act="pay" data-m="online" data-print="1">🖨 Online + Print</button><button data-act="pay" data-m="cash">Cash only</button><button data-act="pay" data-m="online">Online only</button></div><button id="ocancel" style="margin-top:10px;width:100%">Cancel</button></dialog>
<dialog id="matdlg"><form id="mf-form">
<h3 id="mf-title">Add Material</h3>
<label>Name *<input id="mf-name" required maxlength="80" placeholder="e.g. Mozzarella"></label>
<label>Unit (optional)<input id="mf-unit" maxlength="20" placeholder="e.g. kg, pcs, litres"></label>
<label>Category (optional)<input id="mf-cat" list="mf-catlist" maxlength="40" placeholder="e.g. Dairy, Vegetables"><datalist id="mf-catlist"></datalist></label>
<label>Alert threshold (optional)<input id="mf-thr" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 2 — alerts when stock ≤ this"></label>
<p id="mf-err" class="np"></p>
<div class="acts"><button type="button" id="mf-cancel">Cancel</button><button class="primary" type="submit">Save</button></div>
</form></dialog>
<div id="receipt"></div>
<script type="module" src="app.js"></script>
</body></html>
